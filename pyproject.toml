[project]
name = "proyecto-hospital"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Franz2004866", email = "cesarcone462@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
proyecto-hospital = "proyecto_hospital:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
